[project]
name = "fisherman"
version = "1.0.0"
description = "基于 YOLOv8 的视觉自动化程序：数据标注 → 模型训练 → 屏幕识别 → 自动操作"
readme = "README.md"
requires-python = ">=3.8"
authors = [{ name = "Fisherman Team" }]

dependencies = [
    "torch==2.3.0",
    "torchvision==0.18.0",
    "ultralytics>=8.0.0",
    "opencv-python-headless>=4.8.0",
    "PyQt5>=5.15.0",
    "PyQt5-Qt5==5.15.2; sys_platform == 'win32'",
    "mss>=9.0.0",
    "pyautogui>=0.9.50",
    "SQLAlchemy>=2.0.0",
    "Pillow>=10.0.0",
    "numpy<2",
    "pandas>=2.0.0",
    "scipy>=1.10.0",
    "psutil>=6.0.0",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "tuna"
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true
